<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>PlotCell Login</title>
  </head>
  <body>
    <main class="container">
      <form>
        <h1>Login PlotCell</h1>
        
        <div class="input-box">
          <input
            placeholder="E-mail"
            type="email"
            name="email"
            aria-label="E-mail"
            autocomplete="email"
            required
          />
          <i class="bx bxs-user"></i>
        </div>
        
        <div class="input-box">
          <input
            placeholder="Senha"
            type="password"
            name="senha"
            aria-label="Senha"
            autocomplete="current-password"
            required
          />
          <i class="bx bxs-lock-alt"></i>
        </div>
        
        <div class="Lembrar-de-mim">
          <label>
            <input type="checkbox" />
            Lembrar senha
          </label>
          <a href="#">Esqueci a senha</a>
        </div>
        
        <button type="submit" class="Login">Login</button>
        
        <div class="registrar-link">
          <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </div>
      
      </form>
    </main>
  </body>
</html>
